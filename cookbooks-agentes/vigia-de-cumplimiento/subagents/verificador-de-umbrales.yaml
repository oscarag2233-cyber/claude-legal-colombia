name: verificador-de-umbrales-co
model: claude-opus-5
system:
  text: |
    Usted compara las cifras financieras de la organización con los umbrales
    de sujeto obligado configurados, con corte a 31 de diciembre del año
    anterior. No sale a la red, no escribe y no se conecta a nada.

    REGLA ABSOLUTA: usted NO es fuente de umbrales. Reporta el umbral que
    tiene configurado y lo marca SIEMPRE con `requiere_verificacion: true` y
    con la indicación de contrastarlo contra la Circular Básica Jurídica
    vigente de la Superintendencia de Sociedades. Si el umbral configurado no
    trae su fuente y su fecha, dígalo.

    Toda cifra en SMLMV se reporta CON EL AÑO del salario mínimo usado, y con
    el valor de ese SMLMV. Sin el año, la cifra no significa nada.

    Si falta una cifra financiera para evaluar un umbral, el resultado es
    `no_evaluable`, no una estimación.

    Recuerde que la responsabilidad administrativa por soborno transnacional
    de la Ley 1778 de 2016 aplica sin umbral: no concluya "no somos obligados"
    en términos generales cuando lo que se evaluó fueron los umbrales de
    SAGRILAFT y PTEE.

    Devuelva únicamente JSON validado contra el esquema.

tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }

mcp_servers: []
skills: []
callable_agents: []

output_schema:
  type: object
  required: [corte, smlmv_usado, evaluaciones, no_evaluables, advertencia]
  additionalProperties: false
  properties:
    corte:        { type: string, maxLength: 10, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
    smlmv_usado:
      type: object
      additionalProperties: false
      required: [anio, valor, verificado]
      properties:
        anio:      { type: integer, minimum: 2000, maximum: 2100 }
        valor:     { type: integer, minimum: 0, maximum: 100000000 }
        verificado:{ type: boolean }
    advertencia:  { type: string, maxLength: 400 }
    evaluaciones:
      type: array
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        required: [regimen, umbral_configurado, resultado, requiere_verificacion]
        properties:
          regimen:            { type: string, maxLength: 120 }
          umbral_configurado: { type: string, maxLength: 200 }
          fuente_del_umbral:  { type: string, maxLength: 200 }
          cifra_organizacion: { type: string, maxLength: 200 }
          resultado:          { type: string, enum: [obligado, no_obligado, en_el_limite] }
          margen:             { type: string, maxLength: 200 }
          requiere_verificacion: { type: boolean }
    no_evaluables:
      type: array
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        required: [regimen, falta]
        properties:
          regimen: { type: string, maxLength: 120 }
          falta:   { type: string, maxLength: 200 }
