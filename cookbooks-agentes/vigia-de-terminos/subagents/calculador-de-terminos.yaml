name: calculador-de-terminos-co
model: claude-opus-5
system:
  text: |
    Usted recalcula vencimientos a partir de los términos que recibe. No sale
    a la red, no escribe archivos y no se conecta a nada.

    REGLAS DE CÓMPUTO:
      - Los términos judiciales corren en DÍAS HÁBILES salvo norma en
        contrario (CGP art. 118): se excluyen sábados, domingos, festivos y
        días de vacancia judicial.
      - Los plazos de meses y años corren de fecha a fecha (Ley 4 de 1913).
      - En notificación por medio electrónico, la notificación se entiende
        surtida transcurridos dos días hábiles desde el envío, y el término
        corre desde el día siguiente (Ley 2213 de 2022, art. 8). Marque este
        supuesto para verificación.
      - Las suspensiones e interrupciones registradas se aplican y se
        reportan con su soporte.

    NO INVENTE el calendario judicial. Si no se le entregó el listado de días
    no hábiles del año, calcule descontando solo sábados, domingos y festivos
    nacionales conocidos, y marque `calendario_judicial_verificado: false` en
    TODOS los términos. Esa marca es obligatoria y no se omite.

    Ningún término sale sin su norma. Si el término recibido no la trae, el
    resultado es `norma_faltante` y el vencimiento se reporta como no
    calculable, no como una fecha estimada.

    Devuelva únicamente JSON validado contra el esquema.

tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }

mcp_servers: []
skills: []
callable_agents: []

output_schema:
  type: object
  required: [fecha_calculo, calendario_judicial_verificado, calculados, no_calculables]
  additionalProperties: false
  properties:
    fecha_calculo: { type: string, maxLength: 10, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
    calendario_judicial_verificado: { type: boolean }
    acuerdo_calendario: { type: string, maxLength: 120 }
    calculados:
      type: array
      maxItems: 2000
      items:
        type: object
        additionalProperties: false
        required: [asunto, actuacion, norma, vence, franja, dias_restantes]
        properties:
          asunto:        { type: string, maxLength: 80, pattern: "^[A-Za-z0-9._/-]+$" }
          actuacion:     { type: string, maxLength: 200 }
          norma:         { type: string, maxLength: 160 }
          tipo_dias:     { type: string, enum: [habiles, calendario] }
          fecha_inicio:  { type: string, maxLength: 10, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
          razon_inicio:  { type: string, maxLength: 200 }
          vence:         { type: string, maxLength: 10, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
          dias_restantes:{ type: integer, minimum: -3650, maximum: 3650 }
          franja:        { type: string, enum: [vencido, critico, urgente, proximo, horizonte] }
          suspensiones_aplicadas: { type: string, maxLength: 300 }
          responsable:   { type: string, maxLength: 80 }
          requiere_verificacion: { type: string, maxLength: 300 }
    no_calculables:
      type: array
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required: [asunto, motivo]
        properties:
          asunto: { type: string, maxLength: 80, pattern: "^[A-Za-z0-9._/-]+$" }
          motivo: { type: string, enum: [norma_faltante, fecha_inicio_faltante, tipo_dias_no_registrado, datos_insuficientes] }
