# Vigía de términos — cookbook de agente gestionado
# Recalcula términos judiciales y administrativos y avisa lo que vence.

name: vigia-de-terminos-co
model: claude-opus-5

system:
  file: ../../litigio-civil-co/agents/vigia-terminos.md
  append: |
    Está corriendo de forma desatendida. Escriba el reporte en ./salida/;
    no publique en ningún canal directamente.

    NINGÚN TÉRMINO SE REPORTA SIN LA NORMA QUE LO FIJA. Un vencimiento sin
    fundamento no se puede verificar y no sirve.

    Si el calendario judicial del año no está registrado en la configuración,
    dígalo en CADA reporte: los conteos no descuentan vacancia judicial ni
    días no laborables del despacho, y quien lea el reporte tiene que saberlo.

    Su salida es una alerta, no un cálculo definitivo. Un abogado verifica
    cada término contra el expediente y el estado electrónico antes de actuar.

    En el reporte no van nombres completos ni documentos de identidad: use el
    número de caso, el radicado o las iniciales.

    No radica, no presenta memoriales y no contesta nada. Avisa.

tools:
  - type: agent_toolset_20260401
    default_config: { enabled: false }
    configs:
      - { name: read, enabled: true }
      - { name: grep, enabled: true }
      - { name: glob, enabled: true }

mcp_servers: []

skills:
  - { from_plugin: ../../litigio-civil-co }

callable_agents:
  - { manifest: ./subagents/lector-de-registro.yaml }
  - { manifest: ./subagents/calculador-de-terminos.yaml }
  - { manifest: ./subagents/redactor-de-alertas.yaml }   # única hoja con escritura
